<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>作家追踪器 | Writer Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --white: #ffffff;
      --deep-blue: #0A1626;
      --gold: #A88B52;
      --gold-light: #C4A675;
      --gold-glow: rgba(168, 139, 82, 0.15);
      --bg-primary: #FDFCFB;
      --bg-secondary: #F7F5F2;
      --bg-card: #FFFFFF;
      --text-primary: #0A1626;
      --text-secondary: #4A5568;
      --text-muted: #718096;
      --border: #E8E4DF;
      --modern-accent: #0A1626;
      --historical-accent: #A88B52;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.7;
      min-height: 100vh;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 32px;
    }

    /* Elegant Header */
    header {
      padding: 80px 0 64px;
      text-align: center;
      position: relative;
    }

    header::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 1px;
      height: 48px;
      background: linear-gradient(to bottom, transparent, var(--gold));
    }

    .brand {
      margin-bottom: 24px;
    }

    .brand-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 24px;
      border: 1px solid var(--gold);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: var(--gold);
    }

    h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 3rem;
      font-weight: 300;
      letter-spacing: 0.08em;
      color: var(--deep-blue);
      margin-bottom: 16px;
    }

    .subtitle {
      font-family: 'Cormorant Garamond', Georgia, serif;
      color: var(--text-secondary);
      font-size: 1.15rem;
      font-weight: 300;
      letter-spacing: 0.02em;
      max-width: 520px;
      margin: 0 auto;
    }

    .divider {
      width: 60px;
      height: 1px;
      background: var(--gold);
      margin: 40px auto;
    }

    .stats {
      display: flex;
      justify-content: center;
      gap: 64px;
      margin-top: 48px;
    }

    .stat {
      text-align: center;
      position: relative;
    }

    .stat:not(:last-child)::after {
      content: '';
      position: absolute;
      right: -32px;
      top: 50%;
      transform: translateY(-50%);
      width: 1px;
      height: 32px;
      background: var(--border);
    }

    .stat-value {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 2.5rem;
      font-weight: 300;
      color: var(--deep-blue);
      letter-spacing: 0.05em;
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 0.15em;
      margin-top: 4px;
    }

    /* Controls */
    .controls {
      display: flex;
      gap: 20px;
      margin-bottom: 48px;
      align-items: center;
      padding: 24px 0;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    .search-box {
      flex: 1;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 14px 20px 14px 48px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text-primary);
      font-size: 0.9rem;
      font-family: 'Inter', sans-serif;
      transition: all 0.3s;
    }

    .search-box input:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 0 3px var(--gold-glow);
    }

    .search-box input::placeholder {
      color: var(--text-muted);
    }

    .search-box::before {
      content: '◇';
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gold);
      font-size: 0.9rem;
    }

    .filter-tabs {
      display: flex;
      gap: 4px;
      background: var(--bg-secondary);
      padding: 4px;
      border-radius: 4px;
    }

    .filter-tab {
      padding: 10px 24px;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 0.85rem;
      font-weight: 400;
      cursor: pointer;
      border-radius: 2px;
      transition: all 0.3s;
      letter-spacing: 0.03em;
    }

    .filter-tab.active {
      background: var(--deep-blue);
      color: var(--white);
    }

    .filter-tab:hover:not(.active) {
      color: var(--deep-blue);
    }

    /* API Section */
    .api-section {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 32px;
      margin-bottom: 48px;
    }

    .api-section h3 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.25rem;
      font-weight: 400;
      color: var(--deep-blue);
      margin-bottom: 20px;
      letter-spacing: 0.05em;
    }

    .api-endpoints {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
    }

    .api-endpoint {
      background: var(--bg-card);
      padding: 16px 20px;
      border-radius: 3px;
      border: 1px solid var(--border);
      font-size: 0.85rem;
      transition: all 0.3s;
    }

    .api-endpoint:hover {
      border-color: var(--gold);
    }

    .api-endpoint .method {
      color: var(--gold);
      font-weight: 600;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
    }

    .api-endpoint .path {
      color: var(--deep-blue);
      margin-left: 8px;
      font-family: 'SF Mono', Monaco, monospace;
    }

    .api-endpoint .desc {
      color: var(--text-muted);
      margin-top: 8px;
      font-size: 0.8rem;
    }

    /* Writers Grid */
    .section-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.5rem;
      font-weight: 400;
      color: var(--deep-blue);
      margin-bottom: 32px;
      letter-spacing: 0.05em;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .writers-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 24px;
      margin-bottom: 80px;
    }

    .writer-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 32px;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .writer-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: var(--gold);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.4s;
    }

    .writer-card:hover::before {
      transform: scaleX(1);
    }

    .writer-card:hover {
      box-shadow: 0 12px 48px rgba(10, 22, 38, 0.08);
      transform: translateY(-2px);
    }

    .writer-card.modern {
      border-left: 3px solid var(--modern-accent);
    }

    .writer-card.historical {
      border-left: 3px solid var(--historical-accent);
    }

    .writer-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
    }

    .writer-name {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.35rem;
      font-weight: 500;
      color: var(--deep-blue);
      margin-bottom: 4px;
      letter-spacing: 0.02em;
    }

    .writer-identity {
      font-size: 0.8rem;
      color: var(--text-muted);
      letter-spacing: 0.02em;
    }

    .writer-badge {
      padding: 4px 12px;
      border-radius: 2px;
      font-size: 0.7rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      border: 1px solid;
    }

    .writer-badge.modern {
      background: rgba(10, 22, 38, 0.03);
      color: var(--deep-blue);
      border-color: var(--deep-blue);
    }

    .writer-badge.historical {
      background: rgba(168, 139, 82, 0.08);
      color: var(--gold);
      border-color: var(--gold);
    }

    .writer-links {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .writer-link {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.85rem;
      transition: all 0.2s;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
    }

    .writer-link:last-child {
      border-bottom: none;
    }

    .writer-link:hover {
      color: var(--gold);
    }

    .writer-link-icon {
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold);
      font-size: 0.7rem;
    }

    .writer-era {
      font-size: 0.75rem;
      color: var(--gold);
      margin-bottom: 8px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .writer-masterpiece {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1rem;
      color: var(--deep-blue);
      margin-bottom: 16px;
      font-style: italic;
    }

    .writer-description {
      font-size: 0.85rem;
      color: var(--text-secondary);
      line-height: 1.7;
    }

    .empty-state {
      text-align: center;
      padding: 80px 24px;
      color: var(--text-muted);
      grid-column: 1 / -1;
    }

    .empty-state h3 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.5rem;
      font-weight: 400;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    /* Footer */
    footer {
      border-top: 1px solid var(--border);
      padding: 48px 0;
      text-align: center;
    }

    footer p {
      color: var(--text-muted);
      font-size: 0.8rem;
      letter-spacing: 0.05em;
    }

    .footer-brand {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.1rem;
      color: var(--deep-blue);
      margin-bottom: 8px;
      letter-spacing: 0.1em;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .container {
        padding: 0 20px;
      }

      header {
        padding: 60px 0 48px;
      }

      h1 {
        font-size: 2.25rem;
      }

      .stats {
        gap: 32px;
      }

      .stat:not(:last-child)::after {
        display: none;
      }

      .controls {
        flex-direction: column;
      }

      .filter-tabs {
        width: 100%;
        justify-content: center;
      }

      .writers-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <div class="brand-icon">✦</div>
      </div>
      <h1>作家追踪器</h1>
      <p class="subtitle">追踪全球顶级思想领袖与历史文学巨匠的数字阵地</p>
      <div class="divider"></div>
      <div class="stats">
        <div class="stat">
          <div class="stat-value" id="modern-count">30</div>
          <div class="stat-label">Modern Writers</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="historical-count">30</div>
          <div class="stat-label">Historical Figures</div>
        </div>
        <div class="stat">
          <div class="stat-value">60</div>
          <div class="stat-label">Total</div>
        </div>
      </div>
    </header>

    <div class="controls">
      <div class="search-box">
        <input type="text" id="search" placeholder="搜索作家、身份、作品...">
      </div>
      <div class="filter-tabs">
        <button class="filter-tab active" data-filter="all">全部 All</button>
        <button class="filter-tab" data-filter="modern">现代 Modern</button>
        <button class="filter-tab" data-filter="historical">历史 Historical</button>
      </div>
    </div>

    <div class="api-section">
      <h3>API Endpoints</h3>
      <div class="api-endpoints">
        <div class="api-endpoint">
          <div><span class="method">GET</span><span class="path">/api/writers</span></div>
          <div class="desc">获取所有作家列表</div>
        </div>
        <div class="api-endpoint">
          <div><span class="method">GET</span><span class="path">/api/writers/:id</span></div>
          <div class="desc">获取单个作家详情</div>
        </div>
        <div class="api-endpoint">
          <div><span class="method">GET</span><span class="path">/api/check-updates/:id</span></div>
          <div class="desc">检查作家最新文章更新</div>
        </div>
        <div class="api-endpoint">
          <div><span class="method">GET</span><span class="path">/api/search?q=</span></div>
          <div class="desc">搜索作家</div>
        </div>
      </div>
    </div>

    <div class="section-title">Writers & Authors</div>
    <div class="writers-grid" id="writers-grid"></div>

    <footer>
      <div class="footer-brand">Writer Tracker</div>
      <p>Thought Leaders & Literary Masters</p>
    </footer>
  </div>

  <script>
    const API_BASE = window.location.origin;
    let allWriters = { modern: [], historical: [] };
    let currentFilter = 'all';
    let searchQuery = '';

    async function loadWriters() {
      try {
        const response = await fetch(`${API_BASE}/api/writers`);
        const data = await response.json();
        allWriters = data;
        document.getElementById('modern-count').textContent = data.modern.length;
        document.getElementById('historical-count').textContent = data.historical.length;
        renderWriters();
      } catch (error) {
        document.getElementById('writers-grid').innerHTML = `
          <div class="empty-state">
            <h3>无法加载数据</h3>
            <p>请确保服务器正在运行: <code>npm start</code></p>
          </div>
        `;
      }
    }

    function renderWriters() {
      const grid = document.getElementById('writers-grid');
      let writers = [];

      if (currentFilter === 'all') {
        writers = [...allWriters.modern, ...allWriters.historical];
      } else if (currentFilter === 'modern') {
        writers = allWriters.modern;
      } else {
        writers = allWriters.historical;
      }

      if (searchQuery) {
        const q = searchQuery.toLowerCase();
        writers = writers.filter(w => {
          if (w.name.toLowerCase().includes(q)) return true;
          if (w.identity && w.identity.toLowerCase().includes(q)) return true;
          if (w.masterpiece && w.masterpiece.toLowerCase().includes(q)) return true;
          if (w.description && w.description.toLowerCase().includes(q)) return true;
          return false;
        });
      }

      if (writers.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <h3>未找到匹配结果</h3>
            <p>尝试其他搜索词或筛选条件</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = writers.map(writer => {
        const isModern = writer.website !== undefined;
        const type = isModern ? 'modern' : 'historical';
        
        if (isModern) {
          return `
            <div class="writer-card ${type}" data-id="${writer.id}">
              <div class="writer-header">
                <div>
                  <div class="writer-name">${writer.name}</div>
                  <div class="writer-identity">${writer.identity}</div>
                </div>
                <span class="writer-badge ${type}">${type === 'modern' ? '现代' : '历史'}</span>
              </div>
              <div class="writer-links">
                <a href="${writer.website}" target="_blank" rel="noopener" class="writer-link">
                  <span class="writer-link-icon">↗</span>
                  ${writer.website.replace('https://', '')}
                </a>
                ${writer.articles.map(article => `
                  <a href="${article.url}" target="_blank" rel="noopener" class="writer-link">
                    <span class="writer-link-icon">·</span>
                    ${article.title}
                  </a>
                `).join('')}
              </div>
            </div>
          `;
        } else {
          return `
            <div class="writer-card ${type}">
              <div class="writer-header">
                <div>
                  <div class="writer-name">${writer.name}</div>
                </div>
                <span class="writer-badge ${type}">历史</span>
              </div>
              <div class="writer-era">${writer.era}</div>
              <div class="writer-masterpiece">${writer.masterpiece}</div>
              <div class="writer-description">${writer.description}</div>
            </div>
          `;
        }
      }).join('');
    }

    document.getElementById('search').addEventListener('input', (e) => {
      searchQuery = e.target.value;
      renderWriters();
    });

    document.querySelectorAll('.filter-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentFilter = tab.dataset.filter;
        renderWriters();
      });
    });

    document.getElementById('writers-grid').addEventListener('click', async (e) => {
      const card = e.target.closest('.writer-card');
      if (!card) return;
      
      const id = card.dataset.id;
      if (!id) return;

      try {
        const response = await fetch(`${API_BASE}/api/check-updates/${id}`);
        const data = await response.json();
        
        if (data.latestUpdate) {
          alert(`最新更新:\n\n标题: ${data.latestUpdate.title}\n日期: ${new Date(data.latestUpdate.date).toLocaleDateString('zh-CN')}\n\n链接: ${data.latestUpdate.url}`);
        } else {
          alert('未能检测到 RSS 更新源，部分网站不支持自动检测');
        }
      } catch (error) {
        alert('检查更新失败，请稍后重试');
      }
    });

    loadWriters();
  </script>
</body>
</html>
